<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Weight Calculator</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1a1d21;--muted:#6b7280;--accent:#2563eb;--line:#e5e7eb;--hi:#dbeafe;--danger:#dc2626;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--card:#1b1f25;--text:#f1f3f5;--muted:#9aa3af;--accent:#60a5fa;--line:#2b313a;--hi:#1e3a5f;--danger:#f87171}}
:root[data-theme="dark"]{--bg:#111418;--card:#1b1f25;--text:#f1f3f5;--muted:#9aa3af;--accent:#60a5fa;--line:#2b313a;--hi:#1e3a5f;--danger:#f87171}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:16px}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:20px;margin:4px 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
select,input{font-size:17px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);width:100%}
.item{border-bottom:1px solid var(--line);padding:10px 0}
.item:last-child{border-bottom:0}
.line{display:grid;grid-template-columns:1fr 1fr 36px;gap:8px;align-items:center}
.sub{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-top:6px}
.sub b{color:var(--accent);font-size:16px}
.x{background:none;border:0;color:var(--danger);font-size:22px;cursor:pointer}
.add{width:100%;padding:12px;border-radius:10px;border:1px dashed var(--accent);background:none;color:var(--accent);font-size:16px;cursor:pointer;margin-top:10px}
.total{text-align:center}
.big{font-size:38px;font-weight:700;color:var(--accent);margin:4px 0}
.muted{font-size:14px;color:var(--muted)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:8px;text-align:center;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Weight Calculator</h1>
  <div class="card">
    <div class="muted">Pick size + enter pcs. Add as many rows as you need. (Pcs base 1000 /-)</div>
    <div id="items"></div>
    <button class="add" id="add">+ Add another size</button>
  </div>
  <div class="card total">
    <div class="muted">Grand total weight</div>
    <div class="big" id="grand">0.000</div>
    <div class="muted" id="pcs">0 pcs</div>
  </div>
  <div class="card tw">
    <table>
      <thead><tr><th>Size</th><th>Pcs</th><th>Wt</th><th>20 pcs</th></tr></thead>
      <tbody id="tb"></tbody>
    </table>
  </div>
</div>
<script>
var DATA=[["0.80",0.890,"0.015"],["0.90",1.420,"0.025"],["1.000",1.940,"0.040"],["1.10",2.350,"0.050"],["1.20",3.100,"0.060"],["1.30",3.800,"0.075"],["1.40",4.900,"0.100"],["1.50",5.820,"0.120"],["1.60",7.090,"0.140"],["1.70",9.120,"0.180"],["1.80",9.560,"0.190"],["1.90",11.160,"0.220"],["2.00",12.860,"0.250"]];
var items=document.getElementById('items'),tb=document.getElementById('tb');
DATA.forEach(function(d){var tr=document.createElement('tr');tr.innerHTML='<td>'+d[0]+'</td><td>1000 /-</td><td>'+d[1].toFixed(3)+'</td><td>'+d[2]+'</td>';tb.appendChild(tr)});
function addRow(){
  var div=document.createElement('div');div.className='item';
  var opts=DATA.map(function(d,i){return '<option value="'+i+'">'+d[0]+'</option>'}).join('');
  div.innerHTML='<div class="line"><select>'+opts+'</select><input type="number" inputmode="decimal" min="0" placeholder="Pcs, e.g. 20"><button class="x" title="Remove">×</button></div><div class="sub"><span class="f"></span><b class="r">0.000</b></div>';
  div.querySelector('select').value=3;
  div.querySelector('select').onchange=calc;
  div.querySelector('input').oninput=calc;
  div.querySelector('.x').onclick=function(){if(items.children.length>1){div.remove()}else{div.querySelector('input').value=''}calc()};
  items.appendChild(div);calc();
}
function calc(){
  var total=0,pcs=0;
  Array.prototype.forEach.call(items.children,function(div){
    var d=DATA[div.querySelector('select').value],q=parseFloat(div.querySelector('input').value);
    var f=div.querySelector('.f'),r=div.querySelector('.r');
    if(isNaN(q)){f.textContent=d[0]+' → '+d[1].toFixed(3)+' per 1000';r.textContent='0.000';return}
    var v=q/1000*d[1];total+=v;pcs+=q;
    f.textContent=q+' / 1000 × '+d[1].toFixed(3);r.textContent=v.toFixed(3);
  });
  document.getElementById('grand').textContent=total.toFixed(3);
  document.getElementById('pcs').textContent=pcs+' pcs total';
}
document.getElementById('add').onclick=addRow;
addRow();
</script>
</body>
</html>
